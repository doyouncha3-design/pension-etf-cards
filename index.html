<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카드뉴스 편집국</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Pretendard Variable', Pretendard, sans-serif;
    background:#0A1B4D; min-height:100vh; padding:24px; color:#111;
  }
  .top { display:flex; justify-content:space-between; align-items:center; color:#fff; margin-bottom:16px; flex-wrap:wrap; gap:8px; }
  .top h1 { font-size:24px; font-weight:800; }
  .top .topic { background:#1454FF; padding:8px 20px; border-radius:999px; font-size:14px; font-weight:700; }

  #stage-wrap { width:100%; overflow:hidden; }
  #stage {
    position:relative; width:1200px; height:680px;
    transform-origin:top left;
    background:linear-gradient(#edeff4, #e6e9ef);
    border:10px solid #1f2b4d; border-radius:18px;
  }

  /* ---- 벽/창문 ---- */
  #wall { position:absolute; left:0; top:0; right:0; height:42px; background:#b9c4dd; border-bottom:6px solid #8b98b8; }
  .window {
    position:absolute; top:6px; width:90px; height:30px;
    background:linear-gradient(#9fd0ff, #cfe9ff); border:4px solid #7d8db0; border-radius:4px;
  }
  .window::after { content:''; position:absolute; left:50%; top:0; bottom:0; width:3px; background:#7d8db0; }

  /* ---- 구역 ---- */
  /* 구역 = 색깔 베이스플레이트 (스터드 포함) */
  .plate {
    background-image:radial-gradient(circle at 7px 7px, rgba(255,255,255,.4) 2.8px, rgba(0,0,0,.06) 3.5px, transparent 4.2px);
    background-size:24px 24px;
  }
  .room { position:absolute; border:8px solid #1f2b4d; }
  #chief-room {
    left:880px; top:42px; width:300px; height:225px; border-right:none; border-top:none;
    background-color:#ead9b8; border-radius:0 0 0 16px;
  }
  #chief-room .door {
    position:absolute; left:-8px; top:100px; width:8px; height:64px;
    background:#e2b04a; box-shadow:inset 0 0 0 2px #b98b2e; border-radius:2px;
    transform-origin:50% 0%; transition:transform .3s ease;
  }
  #chief-room .door.open { transform:rotate(68deg); }
  #break-room {
    left:0px; top:375px; width:305px; height:285px; border-left:none; border-bottom:none;
    background-color:#f6ebd3; border-radius:0 16px 0 0;
  }
  #break-room .door {
    position:absolute; right:-8px; top:60px; width:8px; height:64px;
    background:#e2b04a; box-shadow:inset 0 0 0 2px #b98b2e; border-radius:2px;
    transform-origin:50% 0%; transition:transform .3s ease;
  }
  #break-room .door.open { transform:rotate(-68deg); }
  .room-label {
    position:absolute; background:#1f2b4d; color:#fff;
    font-size:11px; font-weight:700; padding:4px 12px; border-radius:99px; z-index:500;
    box-shadow:0 2px 0 rgba(0,0,0,.2);
  }
  .zone-rug { position:absolute; border-radius:16px; }
  #lounge-rug { left:355px; top:470px; width:290px; height:185px; background-color:#dccbee; box-shadow:inset 0 0 0 5px #c5aede; }
  #pp-rug { left:680px; top:430px; width:490px; height:225px; background-color:#cfe6d3; box-shadow:inset 0 0 0 5px #aed3b5; }

  /* ---- 소품 ---- */
  .prop { position:absolute; line-height:1; z-index:5; }
  /* 레고 브릭 공통: 밝은 색 + 스터드 + 아랫단 그림자 */
  .brick-studs {
    background-image:radial-gradient(circle at 5px 5px, rgba(255,255,255,.35) 2.2px, transparent 2.8px);
    background-size:14px 14px;
  }

  /* 데스크 아일랜드 (회사식 2열 배치) */
  .island {
    position:absolute; height:44px; border-radius:8px;
    background-color:#c08c55;
    background-image:radial-gradient(circle at 6px 6px, rgba(255,255,255,.3) 2.6px, transparent 3.2px);
    background-size:17px 17px;
    box-shadow:0 6px 0 #96693e, inset 0 2px 0 rgba(255,255,255,.35);
  }
  .ws { position:absolute; }
  .ws .monitor {
    position:absolute; left:50%; transform:translateX(-50%); top:0;
    width:30px; height:20px; background:#1c2333; border:3px solid #3a465f; border-radius:4px;
  }
  .ws .monitor::after { content:''; position:absolute; left:50%; bottom:-6px; transform:translateX(-50%); width:8px; height:4px; background:#3a465f; }
  .ws.on .monitor { background:#1454FF; box-shadow:0 0 14px #1454FF; }
  .ws .ws-label {
    position:absolute; left:50%; transform:translateX(-50%);
    font-size:10px; font-weight:700; color:#4a5878; white-space:nowrap;
    background:rgba(255,255,255,.85); padding:1px 7px; border-radius:99px;
  }
  .divider { position:absolute; width:4px; height:56px; background:#9aa6c0; border-radius:2px; box-shadow:0 3px 0 #7d8aa8; }
  .chair {
    position:absolute; width:24px; height:10px; background:#3d4a68; border-radius:5px;
    box-shadow:0 3px 0 #2c3550, inset 0 2px 0 rgba(255,255,255,.15); z-index:3;
  }
  .chair::after {
    content:''; position:absolute; top:-9px; left:3px; width:18px; height:9px;
    background:#2c3550; border-radius:5px 5px 0 0;
  }

  /* 편집장 책상 */
  .desk {
    position:absolute; width:88px; height:44px;
    background-color:#c08c55;
    background-image:radial-gradient(circle at 6px 6px, rgba(255,255,255,.3) 2.6px, transparent 3.2px);
    background-size:17px 17px;
    border-radius:8px;
    box-shadow:0 6px 0 #96693e, inset 0 2px 0 rgba(255,255,255,.35);
  }
  .desk .monitor {
    position:absolute; left:50%; transform:translateX(-50%); top:-16px;
    width:30px; height:20px; background:#1c2333; border:3px solid #3a465f; border-radius:4px;
  }
  .desk.on .monitor { background:#1454FF; box-shadow:0 0 14px #1454FF; }
  .desk .desk-label {
    position:absolute; top:50px; left:50%; transform:translateX(-50%);
    font-size:10px; font-weight:700; color:#4a5878; white-space:nowrap; background:rgba(255,255,255,.85); padding:1px 7px; border-radius:99px;
  }

  /* 레고 화분 */
  .lego-plant { position:absolute; width:22px; height:30px; z-index:5; }
  .lego-plant::after {
    content:''; position:absolute; top:0; left:0; width:22px; height:19px;
    background:
      radial-gradient(circle at 6px 10px, #2eae5d 6px, transparent 6.6px),
      radial-gradient(circle at 15px 7px, #27a052 6px, transparent 6.6px),
      radial-gradient(circle at 11px 13px, #35b968 6px, transparent 6.6px);
  }
  .lego-plant::before {
    content:''; position:absolute; bottom:0; left:3px; width:16px; height:11px;
    background:#d14b3c; border-radius:2px; box-shadow:0 3px 0 #a53a2e, inset 0 2px 0 rgba(255,255,255,.3);
  }

  /* 탕비실 가전 (레고 브릭풍) */
  .fridge { position:absolute; width:40px; height:66px; background:#eef1f6; border-radius:5px; box-shadow:0 4px 0 #b9c2d4, inset 0 2px 0 #fff, inset 0 -24px 0 #dde3ee; }
  .fridge::before { content:''; position:absolute; top:24px; left:0; right:0; height:3px; background:#b9c2d4; }
  .fridge::after { content:''; position:absolute; top:9px; right:5px; width:3px; height:10px; background:#8b98b8; border-radius:2px; }
  .coffee-machine { position:absolute; width:34px; height:52px; background:#c0453c; border-radius:5px; box-shadow:0 4px 0 #93342d, inset 0 3px 0 rgba(255,255,255,.35); }
  .coffee-machine::after { content:'☕'; position:absolute; top:16px; left:50%; transform:translateX(-50%); font-size:14px; }
  .microwave { position:absolute; width:46px; height:28px; background:#5a6784; border-radius:5px; box-shadow:0 3px 0 #45526b, inset 0 2px 0 rgba(255,255,255,.2); }
  .microwave::after { content:''; position:absolute; left:5px; top:5px; width:26px; height:18px; background:#1e2536; border-radius:3px; box-shadow:inset 0 0 5px #ffb84d; }
  .shelf {
    position:absolute; width:118px; height:72px; background-color:#e2b04a;
    background-image:radial-gradient(circle at 5px 5px, rgba(255,255,255,.35) 2.2px, transparent 2.8px); background-size:14px 14px;
    border-radius:8px; box-shadow:0 5px 0 #b98b2e, inset 0 2px 0 rgba(255,255,255,.4);
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:3px; font-size:24px; padding:4px;
    text-shadow:0 2px 3px rgba(0,0,0,.2);
  }
  .btable {
    position:absolute; width:96px; height:66px; background-color:#e2b04a;
    background-image:radial-gradient(circle at 6px 6px, rgba(255,255,255,.35) 2.4px, transparent 3px); background-size:15px 15px;
    border-radius:50%; box-shadow:0 6px 0 #b98b2e, inset 0 2px 0 rgba(255,255,255,.4); z-index:4;
  }
  .btable::after {
    content:'🍜 🍩 🥤'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:22px; text-shadow:0 2px 3px rgba(0,0,0,.2);
  }
  .vending { position:absolute; width:38px; height:64px; background:#e04444; border-radius:5px; box-shadow:0 4px 0 #ab3030, inset 0 3px 0 rgba(255,255,255,.3); }
  .vending::after { content:'🥤'; position:absolute; top:9px; left:50%; transform:translateX(-50%); font-size:13px; background:rgba(255,255,255,.25); border-radius:3px; padding:2px 4px; }

  .tv-unit { position:absolute; z-index:5; }
  .tv-screen { width:120px; height:66px; background:#131a2b; border:5px solid #2c3550; border-radius:6px; position:relative; overflow:hidden; }
  /* TV 게임 화면: 미니 퐁 게임 */
  .tv-screen.on { background:#0a1233; }
  .tv-screen.on::before {
    content:''; position:absolute; left:10px; top:8px; width:6px; height:6px;
    background:#fff; border-radius:50%; box-shadow:0 0 6px #fff;
    animation:tvball 1.3s infinite alternate ease-in-out;
  }
  .tv-screen.on::after {
    content:''; position:absolute; left:5px; top:18px; width:5px; height:20px;
    background:#3ddc84; border-radius:2px; box-shadow:95px 4px 0 #ff5d5d;
    animation:tvpaddle 1.3s infinite alternate ease-in-out;
  }
  @keyframes tvball { from { transform:translate(0,4px);} to { transform:translate(86px,32px);} }
  @keyframes tvpaddle { from { transform:translateY(-8px);} to { transform:translateY(12px);} }
  .tv-stand { width:70px; height:8px; background:#4a5468; margin:0 auto; border-radius:0 0 4px 4px; }
  .sofa {
    position:absolute; width:170px; height:46px; background-color:#8154c4;
    background-image:radial-gradient(circle at 6px 6px, rgba(255,255,255,.25) 2.4px, transparent 3px); background-size:16px 16px;
    border-radius:12px 12px 7px 7px; box-shadow:0 6px 0 #5d3a8e, inset 0 8px 0 #9a70d6; z-index:400;
  }
  .sofa::before, .sofa::after { content:''; position:absolute; top:-8px; width:14px; height:42px; background:#5d3a8e; border-radius:7px; }
  .sofa::before { left:-6px; } .sofa::after { right:-6px; }

  .pp-table {
    position:absolute; width:190px; height:96px; background-color:#33a05e;
    background-image:radial-gradient(circle at 7px 7px, rgba(255,255,255,.22) 2.6px, transparent 3.2px); background-size:19px 19px;
    border:5px solid #1d6b3c; border-radius:10px; box-shadow:0 6px 0 #175530; z-index:4;
  }
  .pp-table::after { content:''; position:absolute; left:50%; top:-6px; bottom:-6px; width:5px; margin-left:-2px; background:#f2f2f2; border-radius:2px; }
  #ppball { position:absolute; width:9px; height:9px; background:#fff; border-radius:50%; box-shadow:0 1px 2px rgba(0,0,0,.4); z-index:450; display:none; }
  #ppball.play, #ppball.solo-L, #ppball.solo-R { display:block; }
  #ppball.play { animation:rally 0.8s infinite alternate ease-in-out; }
  @keyframes rally { from { transform:translate(0,0);} 50% { transform:translate(80px,-16px);} to { transform:translate(160px,0);} }
  /* 혼자 연습: 자기 쪽 코트에서 통통 */
  #ppball.solo-L { animation:practiceL 0.55s infinite alternate ease-in; }
  @keyframes practiceL { from { transform:translate(2px,2px);} to { transform:translate(62px,-22px);} }
  #ppball.solo-R { animation:practiceR 0.55s infinite alternate ease-in; }
  @keyframes practiceR { from { transform:translate(160px,2px);} to { transform:translate(100px,-22px);} }

  .plant2 { font-size:30px; }

  /* ---- 캐릭터 ---- */
  /* ---- 레고 미니피규어 ---- */
  .person { position:absolute; width:34px; height:56px; }
  .p-inner { position:relative; width:34px; height:56px; }
  .person.working .p-bob { animation:type-bob .45s infinite alternate; }
  @keyframes type-bob { to { transform:translateY(-2px); } }
  .p-stud { width:10px; height:5px; background:#f2c500; border-radius:3px 3px 0 0; margin:0 auto; box-shadow:inset 0 2px 0 rgba(255,255,255,.5); }
  .p-head {
    position:relative; width:20px; height:17px; margin:0 auto;
    background:#FFD500; border-radius:5px;
    box-shadow:inset -2px -2px 0 rgba(0,0,0,.1), inset 2px 2px 0 rgba(255,255,255,.35);
  }
  .p-hair { position:absolute; top:-3px; left:-2px; right:-2px; height:8px; border-radius:6px 6px 2px 2px; }
  .p-eyes { position:absolute; top:6px; left:5px; width:3px; height:3px; background:#1c1c1c; border-radius:50%; box-shadow:8px 0 0 #1c1c1c; }
  .p-smile {
    position:absolute; bottom:2px; left:50%; transform:translateX(-50%);
    width:9px; height:5px; border:2px solid #1c1c1c; border-top:none;
    border-left-color:transparent; border-right-color:transparent; border-radius:0 0 9px 9px;
  }
  .p-body { position:relative; width:34px; height:17px; margin-top:0px; }
  .p-torso {
    width:28px; height:17px; margin:0 auto;
    clip-path:polygon(16% 0, 84% 0, 100% 100%, 0 100%);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.3);
  }
  .p-arm { position:absolute; top:2px; width:6px; height:12px; border-radius:3px; }
  .p-arm.l { left:0; transform:rotate(10deg); } .p-arm.r { right:0; transform:rotate(-10deg); }
  .p-hand { position:absolute; top:13px; width:6px; height:6px; background:#FFD500; border-radius:50%; }
  .p-hand.l { left:0; } .p-hand.r { right:0; }
  .p-hip { width:24px; height:5px; background:#26324e; margin:0 auto; border-radius:1px; }
  .p-legs { display:flex; justify-content:center; gap:3px; }
  .p-leg { width:10px; height:12px; background:#2f3d5e; border-radius:0 0 3px 3px; transform-origin:top center; box-shadow:inset 0 -3px 0 #26324e; }
  .person.walk .p-leg.l { animation:step .3s infinite alternate; }
  .person.walk .p-leg.r { animation:step .3s infinite alternate-reverse; }
  @keyframes step { from { transform:rotate(18deg); } to { transform:rotate(-18deg); } }
  .person.sitting .p-leg { height:6px; }
  .person.sitting { transform:translateY(4px); }
  .p-shadow { position:absolute; bottom:-3px; left:50%; transform:translateX(-50%); width:28px; height:7px; background:rgba(0,0,0,.18); border-radius:50%; }
  .p-name {
    position:absolute; top:58px; left:50%; transform:translateX(-50%);
    font-size:10px; font-weight:800; color:#26355c; background:rgba(255,255,255,.9);
    padding:1px 7px; border-radius:99px; white-space:nowrap; box-shadow:0 1px 0 rgba(0,0,0,.1);
  }
  .p-item { position:absolute; top:12px; right:-18px; font-size:21px; display:none; filter:drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
  .person.leisure .p-item { display:block; animation:munch .7s infinite alternate; }
  @keyframes munch { from { transform:translateY(0) rotate(0);} to { transform:translateY(-3px) rotate(-12deg);} }
  .p-bubble {
    position:absolute; bottom:62px; left:50%; transform:translateX(-50%);
    background:#fff; border:2px solid #26355c; border-radius:8px;
    font-size:11px; font-weight:600; padding:4px 8px; white-space:nowrap;
    max-width:230px; overflow:hidden; text-overflow:ellipsis;
    opacity:0; transition:opacity .3s; z-index:1000;
  }
  .p-bubble::after {
    content:''; position:absolute; bottom:-6px; left:50%; margin-left:-5px;
    border:5px solid transparent; border-top-color:#26355c; border-bottom:0;
  }
  .person.working .p-bubble, .person.error .p-bubble, .person.show-bubble .p-bubble { opacity:1; }
  .person.error .p-bubble { border-color:#E11D1D; color:#E11D1D; }

  /* ---- 하단 패널 공통 ---- */
  .panel { background:#fff; border-radius:14px; padding:16px 20px; }
  .panel h2 { font-size:15px; font-weight:800; margin-bottom:10px; color:#0A1B4D; }
  .bottom-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; }
  @media (max-width: 720px) { .bottom-grid { grid-template-columns:1fr; } }

  /* ---- 갤러리 ---- */
  #gallery-strip { display:flex; gap:14px; overflow-x:auto; padding-bottom:6px; }
  .g-item { flex:0 0 150px; cursor:pointer; text-align:center; }
  .g-item img { width:150px; height:150px; border-radius:12px; border:3px solid #e6eaf4; display:block; }
  .g-item:hover img { border-color:#1454FF; }
  .g-title { font-size:12px; font-weight:700; margin-top:6px; color:#26355c; line-height:1.3; word-break:keep-all; }
  .g-date { font-size:11px; color:#98a2b8; }

  /* ---- 뷰어 모달 ---- */
  #viewer { position:fixed; inset:0; background:rgba(4,10,32,.9); display:none; z-index:5000;
    align-items:center; justify-content:center; flex-direction:column; gap:14px; padding:20px; }
  #viewer.open { display:flex; }
  #viewer img { max-width:min(92vw, 560px); max-height:70vh; border-radius:14px; }
  #v-nav { display:flex; align-items:center; gap:18px; color:#fff; font-weight:700; }
  #v-nav button { background:#1454FF; color:#fff; border:none; border-radius:999px; width:44px; height:44px; font-size:20px; cursor:pointer; }
  #v-nav button:disabled { opacity:.3; }
  #v-links a { color:#9fd0ff; font-size:13px; }
  #v-close { position:absolute; top:18px; right:24px; background:none; border:none; color:#fff; font-size:30px; cursor:pointer; }

  /* ---- 작업 요청 ---- */
  #req-form { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  #req-form input { border:2px solid #dfe5f2; border-radius:10px; padding:10px 14px; font-size:14px; font-family:inherit; }
  #req-form input:focus { outline:none; border-color:#1454FF; }
  #req-topic { flex:1; min-width:180px; }
  #req-send { background:#1454FF; color:#fff; border:none; border-radius:10px; padding:10px 20px; font-size:14px; font-weight:700; cursor:pointer; }
  #req-send:disabled { opacity:.5; }
  #req-msg { font-size:12px; color:#0a9d58; font-weight:600; min-height:16px; margin-bottom:6px; }
  .req-row { font-size:13px; padding:7px 0; border-bottom:1px solid #F1F3F8; display:flex; gap:8px; align-items:center; }
  .req-badge { font-size:11px; font-weight:700; padding:2px 10px; border-radius:99px; white-space:nowrap; }
  .req-badge.pending { background:#fff3d6; color:#a06b00; }
  .req-badge.approved { background:#e6f0ff; color:#3a6cd8; }
  .approve-btn {
    flex:none; background:#0a9d58; color:#fff; border:none; border-radius:8px;
    padding:4px 12px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .approve-btn:hover { background:#088a4d; }
  .req-badge.working { background:#dce7ff; color:#1454FF; }
  .req-badge.done { background:#dcf5e7; color:#0a9d58; }
  .req-badge.rejected { background:#fde3e3; color:#c22; }
  .req-row a { color:#1454FF; font-size:12px; }

  /* ---- 업무 일지 ---- */
  /* 근거 검증실 */
  #ev-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .ev-tab {
    border:2px solid #dfe5f2; background:#fff; border-radius:999px;
    padding:6px 14px; font-size:12px; font-weight:700; cursor:pointer; color:#5a6884; font-family:inherit;
  }
  .ev-tab.on { background:#1454FF; border-color:#1454FF; color:#fff; }
  .ev-row { display:flex; gap:10px; align-items:flex-start; font-size:13px; padding:8px 0; border-bottom:1px solid #F1F3F8; }
  .ev-card-badge {
    flex:none; background:#EEF3FF; color:#1454FF; font-size:11px; font-weight:800;
    padding:2px 8px; border-radius:6px; margin-top:1px;
  }
  .ev-kind { flex:none; font-size:11px; color:#98a2b8; margin-top:2px; width:52px; }
  .ev-claim { flex:1; line-height:1.45; word-break:keep-all; }
  .ev-link { flex:none; font-size:12px; font-weight:700; color:#1454FF; text-decoration:none; margin-top:1px; white-space:nowrap; }
  .ev-link:hover { text-decoration:underline; }
  #v-evidence {
    background:rgba(255,255,255,.08); border-radius:12px; padding:10px 16px;

<script>
// ---------- Supabase (공개 읽기 전용 키) ----------
const SUPA_URL = 'https://wnrnknedxceoogvfoynt.supabase.co';
const SUPA_KEY = 'sb_publishable_4YfVaGCnoitzVp-Jh0j_Qg_NHRLkbu5';
const H = { apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY };
const sfetch = (path, opt = {}) =>
  fetch(`${SUPA_URL}/rest/v1/${path}`, { ...opt, headers: { ...H, 'Content-Type': 'application/json', ...(opt.headers || {}) } });

// ---------- 캐릭터/무대 설정 ----------
const ROLES = {
  chief:      { name:'무결',   role:'편집장',  shirt:'#3a4a6b', hair:'#2c2c2c', skin:'#f2c9a0' },
  researcher: { name:'윤호',   role:'리서처',  shirt:'#8a6d3b', hair:'#5b3a1e', skin:'#f2c9a0' },
  writer:     { name:'연아',   role:'작가',    shirt:'#1454FF', hair:'#6b4226', skin:'#ffd9b0' },
  designer:   { name:'지디',   role:'디자이너', shirt:'#c2437e', hair:'#e0b830', skin:'#f2c9a0' },
  reviewer:   { name:'개빡빡', role:'검수자',  shirt:'#0a9d58', hair:'#3d3d3d', skin:'#e8b98a' },
  publisher:  { name:'막뿌려', role:'발행인',  shirt:'#e07b00', hair:'#111', skin:'#ffd9b0' },
};
// 회사식 2열 데스크 아일랜드: A열(위) 3석 + B열(아래) 2석, 편집장은 별실
const ISLANDS = { A: { x:340, y:150, w:470 }, B: { x:340, y:250, w:470 } };
const SEATS = {
  researcher: { x:405, row:'A' }, writer: { x:575, row:'A' }, designer: { x:745, row:'A' },
  reviewer:   { x:470, row:'B' }, publisher: { x:680, row:'B' },
};
const CHIEF_DESK = { x:1000, y:120 };
const workPos = (role) => role === 'chief'
  ? { x: CHIEF_DESK.x + 44, y: CHIEF_DESK.y + 24 }
  : { x: SEATS[role].x, y: ISLANDS[SEATS[role].row].y + 18 };
const LEISURE = [
  { id:'eat1',  x:85,  y:545, act:'eat' },
  { id:'eat2',  x:195, y:545, act:'eat' },
  { id:'eat3',  x:140, y:610, act:'eat' },
  { id:'coffee',x:92,  y:475, act:'drink' },
  { id:'sofa1', x:440, y:592, act:'game' },
  { id:'sofa2', x:510, y:592, act:'game' },
  { id:'pp-L',  x:765, y:555, act:'pp', face:1 },
  { id:'pp-R',  x:1010, y:555, act:'pp', face:-1 },
];
const ITEM = { drink:'☕', game:'🎮', pp:'🏓' };
const EAT_ITEMS = ['🍜','🥤','🍫','🍪'];
const SPEED = 90;

const inBreak = (p) => p.x < 315 && p.y > 365;
const inChief = (p) => p.x > 865 && p.y < 275;
const BREAK_DOOR_OUT = {x:340,y:467}, BREAK_DOOR_IN = {x:270,y:467};
const CHIEF_DOOR_OUT = {x:845,y:172}, CHIEF_DOOR_IN = {x:915,y:172};
const PATROL = [ {x:360,y:340},{x:850,y:340},{x:850,y:110},{x:360,y:110},{x:600,y:400} ];

function route(from, to) {
  const wp = [];
  if (inBreak(from) && !inBreak(to)) wp.push(BREAK_DOOR_IN, BREAK_DOOR_OUT);
  if (inChief(from) && !inChief(to)) wp.push(CHIEF_DOOR_IN, CHIEF_DOOR_OUT);
  if (!inBreak(from) && inBreak(to)) wp.push(BREAK_DOOR_OUT, BREAK_DOOR_IN);
  if (!inChief(from) && inChief(to)) wp.push(CHIEF_DOOR_OUT, CHIEF_DOOR_IN);
  wp.push({x:to.x, y:to.y});
  return wp;
}

const stage = document.getElementById('stage');
// 데스크 아일랜드 2개 + 파티션
for (const [key, isl] of Object.entries(ISLANDS)) {
  const el = document.createElement('div');
  el.className = 'island';
  el.style.left = isl.x + 'px'; el.style.top = isl.y + 'px'; el.style.width = isl.w + 'px';
  el.style.zIndex = isl.y + 60;
  stage.appendChild(el);
  // 좌석 사이 파티션
  const seats = Object.values(SEATS).filter(s => s.row === key).map(s => s.x).sort((a, b) => a - b);
  for (let i = 0; i < seats.length - 1; i++) {
    const dv = document.createElement('div');
    dv.className = 'divider';
    dv.style.left = ((seats[i] + seats[i + 1]) / 2) + 'px';
    dv.style.top = (isl.y - 8) + 'px';
    dv.style.zIndex = isl.y + 61;
    stage.appendChild(dv);
  }
}
// 좌석별 워크스테이션 (모니터 + 이름표 + 의자)
for (const [role, s] of Object.entries(SEATS)) {
  const isl = ISLANDS[s.row];
  const ws = document.createElement('div');
  ws.className = 'ws'; ws.id = 'desk-' + role;
  ws.style.left = s.x + 'px'; ws.style.top = isl.y + 'px';
  ws.style.zIndex = isl.y + 62;
  ws.innerHTML = `<div class="monitor" style="top:8px"></div>
    <div class="ws-label" style="top:50px">${ROLES[role].name} · ${ROLES[role].role}</div>`;
  stage.appendChild(ws);
  const chair = document.createElement('div');
  chair.className = 'chair';
  chair.style.left = (s.x - 12) + 'px';
  chair.style.top = (isl.y - 24) + 'px';
  stage.appendChild(chair);
}
// 편집장 책상
{
  const el = document.createElement('div');
  el.className = 'desk'; el.id = 'desk-chief';
  el.style.left = CHIEF_DESK.x + 'px'; el.style.top = CHIEF_DESK.y + 'px';
  el.style.zIndex = CHIEF_DESK.y + 62;
  el.innerHTML = `<div class="monitor"></div><div class="desk-label">${ROLES.chief.name} · ${ROLES.chief.role}</div>`;
  stage.appendChild(el);
}

const occupied = {};
const chars = {};
Object.entries(ROLES).forEach(([role, cfg], i) => {
  const el = document.createElement('div');
  el.className = 'person'; el.id = 'p-' + role;
  el.innerHTML = `
    <div class="p-bubble"></div>
    <div class="p-inner"><div class="p-bob">
      <div class="p-stud"></div>
      <div class="p-head"><div class="p-hair" style="background:${cfg.hair}"></div><div class="p-eyes"></div><div class="p-smile"></div></div>
      <div class="p-body">
        <div class="p-arm l" style="background:${cfg.shirt}"></div>
        <div class="p-arm r" style="background:${cfg.shirt}"></div>
        <div class="p-torso" style="background:${cfg.shirt}"></div>
        <div class="p-hand l"></div><div class="p-hand r"></div>
      </div>
      <div class="p-hip"></div>
      <div class="p-legs"><div class="p-leg l"></div><div class="p-leg r"></div></div>
    </div></div>
    <div class="p-shadow"></div>
    <div class="p-item"></div>
    <div class="p-name">${cfg.name}</div>`;
  stage.appendChild(el);
  const spot = role === 'chief' ? workPos('chief') : LEISURE[i % LEISURE.length];
  chars[role] = { el, x:spot.x, y:spot.y, queue:[], state:'', wanderAt:0, patrolIdx:0, spot:null };
});

function freeSpots() { return LEISURE.filter(s => !occupied[s.id]); }
function releaseSpot(role) {
  const c = chars[role];
  if (c.spot) { delete occupied[c.spot.id]; c.spot = null; }
}
function claimLeisure(role) {
  const c = chars[role];
  releaseSpot(role);
  const free = freeSpots();
  const spot = free[Math.floor(Math.random() * free.length)] || LEISURE[0];
  occupied[spot.id] = role; c.spot = spot;
  if (spot.act === 'pp') {
    // 탁구대를 밟지 않게 테이블 아래로 돌아서 접근
    c.queue = route({x:c.x,y:c.y}, { x: spot.x, y: 606 });
    c.queue.push({ x: spot.x, y: spot.y });
  } else {
    c.queue = route({x:c.x,y:c.y}, spot);
  }
}

// ---------- 상태 폴링 ----------
async function fetchStatus() {
  let status;
  try {
    const rows = await (await sfetch('office_status?id=eq.1&select=data,updated_at')).json();
    if (!rows.length) return;
    status = rows[0].data;
    document.getElementById('updated').textContent = '마지막 갱신: ' + new Date(rows[0].updated_at).toLocaleString('ko-KR');
  } catch (e) { return; }

  document.getElementById('topic').textContent = '📌 ' + (status.topic || '대기 중');
  document.getElementById('log').innerHTML = (status.log || []).map(e => {
    const r = ROLES[e.role];
    return `<div class="entry"><span class="time">${e.time}</span> <span class="who">${r ? r.name + '(' + r.role + ')' : e.role}</span> ${e.msg}</div>`;
  }).join('') || '<div class="entry">아직 기록이 없습니다</div>';

  for (const [role, c] of Object.entries(chars)) {
    const a = (status.agents || {})[role] || { state:'idle', msg:'' };
    c.el.querySelector('.p-bubble').textContent = a.msg || '';
    document.getElementById('desk-' + role).classList.toggle('on', a.state === 'working');
    c.el.classList.toggle('error', a.state === 'error');

    if (a.state !== c.state) {
      c.state = a.state;
      if (a.state === 'working' || a.state === 'error') {
        releaseSpot(role);
        if (role === 'chief') { c.queue = route({x:c.x,y:c.y}, PATROL[0]); c.patrolIdx = 0; }
        else c.queue = route({x:c.x,y:c.y}, workPos(role));
      } else {
        if (role === 'chief') c.queue = route({x:c.x,y:c.y}, workPos('chief'));
        else claimLeisure(role);
        if (a.state === 'done' && a.msg) {
          c.el.classList.add('show-bubble');
          setTimeout(() => c.el.classList.remove('show-bubble'), 6000);
        }
      }
    }
  }
}

// ---------- 이동/연출 루프 ----------
let last = performance.now();
function tick() {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 1); last = now;

  for (const [role, c] of Object.entries(chars)) {
    const target = c.queue[0];
    if (target) {
      const dx = target.x - c.x, dy = target.y - c.y;
      const dist = Math.hypot(dx, dy);
      const step = SPEED * dt;
      if (dist <= step) { c.x = target.x; c.y = target.y; c.queue.shift(); }
      else {
        c.x += dx / dist * step; c.y += dy / dist * step;
        if (Math.abs(dx) > 2) c.el.querySelector('.p-inner').style.transform = dx < 0 ? 'scaleX(-1)' : '';
      }
      c.el.classList.add('walk');
      c.el.classList.remove('leisure', 'sitting');
    } else {
      c.el.classList.remove('walk');
      const resting = c.state === 'idle' || c.state === 'done';

      if (role === 'chief' && (c.state === 'working' || c.state === 'error')) {
        c.patrolIdx = (c.patrolIdx + 1) % PATROL.length;
        c.queue = [PATROL[c.patrolIdx]];
      }
      else if (role !== 'chief' && resting && c.spot) {
        c.el.classList.add('leisure');
        const item = c.el.querySelector('.p-item');
        if (c.spot.act === 'eat') { if (!item.textContent || '🎮🏓☕'.includes(item.textContent)) item.textContent = EAT_ITEMS[Math.floor(Math.random()*EAT_ITEMS.length)]; }
        else item.textContent = ITEM[c.spot.act];
        if (c.spot.act === 'game') c.el.classList.add('sitting');
        if (c.spot.face) c.el.querySelector('.p-inner').style.transform = c.spot.face < 0 ? 'scaleX(-1)' : '';
        if (now > c.wanderAt) {
          c.wanderAt = now + 9000 + Math.random() * 14000;
          if (Math.random() < 0.45) claimLeisure(role);
        }
      }
    }
    c.el.classList.toggle('working', (c.state === 'working') && !c.queue.length && role !== 'chief');
    c.el.style.left = (c.x - 17) + 'px';
    c.el.style.top = (c.y - 56) + 'px';
    c.el.style.zIndex = Math.round(c.y);
  }

  // 탁구: 둘이면 랠리, 혼자면 자기 코트에서 연습
  const ppL = occupied['pp-L'] && !chars[occupied['pp-L']].queue.length;
  const ppR = occupied['pp-R'] && !chars[occupied['pp-R']].queue.length;
  const ball = document.getElementById('ppball');
  ball.classList.toggle('play', !!(ppL && ppR));
  ball.classList.toggle('solo-L', !!(ppL && !ppR));
  ball.classList.toggle('solo-R', !!(ppR && !ppL));
  const tvOn = occupied['sofa1'] || occupied['sofa2'];
  document.getElementById('tv').classList.toggle('on', !!tvOn);

  // 문 여닫기: 캐릭터가 문 근처를 지나면 열린다
  let chiefOpen = false, breakOpen = false;
  for (const c of Object.values(chars)) {
    if (Math.hypot(c.x - 876, c.y - 174) < 52) chiefOpen = true;
    if (Math.hypot(c.x - 309, c.y - 467) < 52) breakOpen = true;
  }
  document.querySelector('#chief-room .door').classList.toggle('open', chiefOpen);
  document.querySelector('#break-room .door').classList.toggle('open', breakOpen);
}

// ---------- 갤러리 + 뷰어 ----------
let posts = [];
let vPost = null, vIdx = 0;
const cardUrl = (p, i) => `${p.base_url}/card-${String(i + 1).padStart(2, '0')}.png`;

async function fetchPosts() {
  try { posts = await (await sfetch('office_posts?select=*&order=date.desc,slug.desc')).json(); }
  catch (e) { return; }
  document.getElementById('gallery-strip').innerHTML = posts.map((p, i) =>
    `<div class="g-item" onclick="openViewer(${i})">
      <img src="${cardUrl(p, 0)}" loading="lazy" alt="${p.topic}">
      <div class="g-title">${p.topic}</div>
      <div class="g-date">${p.date} · ${p.cards}장</div>
    </div>`
  ).join('') || '아직 발행물이 없습니다';
  renderEvTabs();
}
function renderViewer() {
  document.getElementById('v-img').src = cardUrl(vPost, vIdx);
  document.getElementById('v-count').textContent = `${vIdx + 1} / ${vPost.cards}`;
  document.getElementById('v-prev').disabled = vIdx === 0;
  document.getElementById('v-next').disabled = vIdx === vPost.cards - 1;
  const a = document.getElementById('v-insta');
  a.style.display = vPost.permalink ? '' : 'none';
  a.href = vPost.permalink || '#';
  // 이 카드의 근거 표시
  const items = (evidence[vPost.slug] || []).filter(e => e.card === vIdx + 1);
  const box = document.getElementById('v-evidence');
  box.hidden = !items.length;
  box.innerHTML = items.length ? '<div id="v-ev-title">📎 이 카드의 근거</div>' + items.map(evRow).join('') : '';
}

// ---------- 근거 검증실 ----------
let evidence = {}; // slug → items
let evSelected = null;
const esc = (t) => String(t || '').replace(/</g, '&lt;');
const evRow = (e) => `<div class="ev-row">
  <span class="ev-card-badge">카드 ${esc(e.card)}</span>
  <span class="ev-kind">${esc(e.kind)}</span>
  <span class="ev-claim">${esc(e.claim)}</span>
  <a class="ev-link" href="${encodeURI(e.url || '')}" target="_blank" rel="noopener">${esc(e.source)} ↗</a>
</div>`;

async function fetchEvidence() {
  try {
    const rows = await (await sfetch('office_evidence?select=slug,items')).json();
    evidence = Object.fromEntries(rows.map(r => [r.slug, r.items]));
  } catch (e) { return; }
  renderEvTabs();
}
function renderEvTabs() {
  const slugs = posts.filter(p => evidence[p.slug]).map(p => p.slug);
  if (!slugs.length) { document.getElementById('ev-list').textContent = '아직 검증 자료가 없습니다'; return; }
  if (!evSelected || !evidence[evSelected]) evSelected = slugs[0];
  document.getElementById('ev-tabs').innerHTML = posts.filter(p => evidence[p.slug]).map(p =>
    `<button class="ev-tab ${p.slug === evSelected ? 'on' : ''}" onclick="selectEv('${p.slug}')">${esc(p.topic)}</button>`
  ).join('');
  document.getElementById('ev-list').innerHTML =
    (evidence[evSelected] || []).slice().sort((a, b) => a.card - b.card).map(evRow).join('');
}
window.selectEv = (slug) => { evSelected = slug; renderEvTabs(); };
window.openViewer = (i) => { vPost = posts[i]; vIdx = 0; renderViewer(); document.getElementById('viewer').classList.add('open'); };
document.getElementById('v-close').onclick = () => document.getElementById('viewer').classList.remove('open');
document.getElementById('viewer').onclick = (e) => { if (e.target.id === 'viewer') document.getElementById('viewer').classList.remove('open'); };
document.getElementById('v-prev').onclick = () => { if (vIdx > 0) { vIdx--; renderViewer(); } };
document.getElementById('v-next').onclick = () => { if (vIdx < vPost.cards - 1) { vIdx++; renderViewer(); } };
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('viewer').classList.contains('open')) return;
  if (e.key === 'ArrowLeft' && vIdx > 0) { vIdx--; renderViewer(); }
  if (e.key === 'ArrowRight' && vIdx < vPost.cards - 1) { vIdx++; renderViewer(); }
  if (e.key === 'Escape') document.getElementById('viewer').classList.remove('open');
});

// ---------- 작업 요청 ----------
const BADGE = { pending:'검토 대기', approved:'승인됨 · 제작 대기', working:'제작 중', done:'완료', rejected:'보류' };
async function fetchRequests() {
  let reqs;
  try { reqs = await (await sfetch('office_requests?select=*&order=id.desc&limit=8')).json(); }
  catch (e) { return; }
  document.getElementById('req-list').innerHTML = reqs.map(r =>
    `<div class="req-row">
      <span class="req-badge ${r.status}">${BADGE[r.status] || r.status}</span>
      <span style="flex:1">${r.topic.replace(/</g, '&lt;')}${r.requester ? ` <span style="color:#98a2b8;font-size:11px">— ${String(r.requester).replace(/</g, '&lt;')}님</span>` : ''}</span>
      ${r.status === 'pending' ? `<button class="approve-btn" onclick="approveReq(${r.id})">🔑 승인</button>` : ''}
      ${r.result_url ? `<a href="${r.result_url}" target="_blank" rel="noopener">보기↗</a>` : ''}
    </div>`
  ).join('') || '<div class="req-row">아직 요청이 없습니다</div>';
}

// 관리자 승인: 비번은 서버(Supabase)에서만 검증된다
window.approveReq = async (id) => {
  const pin = prompt('관리자 비밀번호를 입력하세요');
  if (pin === null) return;
  try {
    const res = await sfetch('rpc/office_approve_request', {
      method: 'POST', body: JSON.stringify({ p_pin: pin, p_id: id }),
    });
    const result = await res.json();
    if (result === 'ok') {
      document.getElementById('req-msg').textContent = '승인 완료! 편집국이 제작을 시작합니다 ✅';
      setTimeout(() => document.getElementById('req-msg').textContent = '', 5000);
    } else if (result === 'wrong_pin') alert('비밀번호가 틀렸습니다');
    else if (result === 'no_pin') alert('관리자 비밀번호가 아직 설정되지 않았습니다');
    fetchRequests();
  } catch (e) { alert('요청 실패 — 잠시 후 다시 시도해주세요'); }
};
document.getElementById('req-send').onclick = async () => {
  const input = document.getElementById('req-topic');
  const topic = input.value.trim();
  if (topic.length < 2) return;
  const btn = document.getElementById('req-send');
  btn.disabled = true;
  const requester = document.getElementById('req-name').value.trim() || null;
  try {
    const res = await sfetch('office_requests', { method:'POST', body: JSON.stringify({ topic, requester }) });
    if (!res.ok) throw new Error(await res.text());
    input.value = '';
    document.getElementById('req-msg').textContent = '접수됐습니다! 편집국 검토 후 제작됩니다 ✅';
    setTimeout(() => document.getElementById('req-msg').textContent = '', 5000);
    fetchRequests();
  } catch (e) {
    document.getElementById('req-msg').textContent = '요청 실패 — 잠시 후 다시 시도해주세요';
  }
  btn.disabled = false;
};
document.getElementById('req-topic').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('req-send').click(); });

// ---------- 스케일/시작 ----------
function fit() {
  const w = document.getElementById('stage-wrap').clientWidth;
  const s = Math.min(1, w / 1220);
  stage.style.transform = `scale(${s})`;
  document.getElementById('stage-wrap').style.height = (700 * s) + 'px';
}
window.addEventListener('resize', fit);

fit();
fetchStatus(); fetchPosts(); fetchRequests(); fetchEvidence();
setInterval(fetchEvidence, 60000);
setInterval(fetchStatus, 2500);
setInterval(fetchRequests, 10000);
setInterval(fetchPosts, 30000);
setInterval(tick, 33);
</script>
</body>
