<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Pretendard Variable', Pretendard, sans-serif;
    background:#0A1B4D; min-height:100vh; padding:24px; color:#111;
  }
  .top { display:flex; justify-content:space-between; align-items:center; color:#fff; margin-bottom:16px; flex-wrap:wrap; gap:8px; }
  .top h1 { font-size:24px; font-weight:800; }
  .top .topic { background:#1454FF; padding:8px 20px; border-radius:999px; font-size:14px; font-weight:700; }

  #stage-wrap { width:100%; overflow:hidden; }
  #stage {
    position:relative; width:1200px; height:680px;
    transform-origin:top left;
    background:
      repeating-linear-gradient(0deg, transparent 0 38px, rgba(20,84,255,.04) 38px 40px),
      repeating-linear-gradient(90deg, transparent 0 38px, rgba(20,84,255,.04) 38px 40px),
      #e9edf6;
    border:10px solid #26355c; border-radius:14px;
  }

  /* ---- 벽/창문 ---- */
  #wall { position:absolute; left:0; top:0; right:0; height:42px; background:#b9c4dd; border-bottom:6px solid #8b98b8; }
  .window {
    position:absolute; top:6px; width:90px; height:30px;
    background:linear-gradient(#9fd0ff, #cfe9ff); border:4px solid #7d8db0; border-radius:4px;
  }
  .window::after { content:''; position:absolute; left:50%; top:0; bottom:0; width:3px; background:#7d8db0; }

  /* ---- 구역 ---- */
  .room { position:absolute; border:8px solid #26355c; }
  #chief-room {
    left:880px; top:42px; width:320px; height:225px; border-right:none; border-top:none;
    background:repeating-linear-gradient(90deg, #d9c9ad 0 26px, #d1bfa0 26px 52px);
  }
  #chief-room .door { position:absolute; left:-8px; top:100px; width:8px; height:64px; background:#c9a86a; box-shadow:inset 0 0 0 2px #a3854e; }
  #break-room {
    left:0px; top:375px; width:305px; height:305px; border-left:none; border-bottom:none;
    background:repeating-conic-gradient(#f2f2ee 0 25%, #e6e4da 0 50%) 0 0/44px 44px;
  }
  #break-room .door { position:absolute; right:-8px; top:60px; width:8px; height:64px; background:#c9a86a; box-shadow:inset 0 0 0 2px #a3854e; }
  .room-label {
    position:absolute; background:#26355c; color:#fff;
    font-size:11px; font-weight:700; padding:3px 10px; border-radius:6px; z-index:500;
  }
  .zone-rug { position:absolute; border-radius:14px; }
  #office-rug { left:330px; top:80px; width:470px; height:260px; background:rgba(20,84,255,.08); border:3px dashed rgba(20,84,255,.18); }
  #lounge-rug { left:355px; top:470px; width:290px; height:185px; background:#d8c7e8; box-shadow:inset 0 0 0 6px #c7b3dc; }
  #pp-rug { left:680px; top:430px; width:490px; height:225px; background:#cfe3d2; box-shadow:inset 0 0 0 6px #b8d4bc; }

  /* ---- 소품 ---- */
  .prop { position:absolute; line-height:1; z-index:5; }
  .desk {
    position:absolute; width:82px; height:42px;
    background:#a5794e; border-radius:6px;
    box-shadow:0 5px 0 #7d5936, inset 0 2px 0 rgba(255,255,255,.25);
  }
  .desk .monitor {
    position:absolute; left:50%; transform:translateX(-50%); top:-15px;
    width:27px; height:19px; background:#1c2333; border:2px solid #3a465f; border-radius:3px;
  }
  .desk.on .monitor { background:#1454FF; box-shadow:0 0 12px #1454FF; }
  .desk .kb { position:absolute; left:14px; bottom:8px; width:22px; height:8px; background:#e8e8ee; border-radius:2px; }
  .desk .doc { position:absolute; right:10px; bottom:7px; width:14px; height:10px; background:#fff; border-radius:1px; box-shadow:2px -2px 0 #ffe9a8; }
  .desk .desk-label {
    position:absolute; top:47px; left:50%; transform:translateX(-50%);
    font-size:10px; font-weight:700; color:#5a6884; white-space:nowrap; background:rgba(255,255,255,.7); padding:0 5px; border-radius:99px;
  }
  .fridge { position:absolute; width:40px; height:64px; background:#e8ecf2; border:3px solid #b9c2d4; border-radius:5px; }
  .fridge::before { content:''; position:absolute; top:22px; left:0; right:0; height:3px; background:#b9c2d4; }
  .fridge::after { content:''; position:absolute; top:8px; right:4px; width:3px; height:10px; background:#8b98b8; }
  .coffee-machine { position:absolute; width:34px; height:50px; background:#8b3a3a; border-radius:4px; box-shadow:inset 0 6px 0 rgba(255,255,255,.2); }
  .coffee-machine::after { content:'☕'; position:absolute; top:15px; left:50%; transform:translateX(-50%); font-size:14px; }
  .microwave { position:absolute; width:44px; height:28px; background:#4a5468; border-radius:4px; }
  .microwave::after { content:''; position:absolute; left:5px; top:5px; width:24px; height:18px; background:#202636; border-radius:2px; box-shadow:inset 0 0 4px #ffb84d; }
  .shelf { position:absolute; width:110px; height:66px; background:#c9a86a; border-radius:4px; box-shadow:0 4px 0 #a3854e; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:2px; font-size:16px; padding:4px; }
  .btable { position:absolute; width:84px; height:56px; background:#c9a86a; border-radius:50%; box-shadow:0 6px 0 #a3854e; z-index:4; }
  .btable::after { content:'🍜  🥤'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:15px; }
  .vending { position:absolute; width:38px; height:62px; background:#d13c3c; border-radius:4px; box-shadow:inset 0 0 0 3px #a82e2e; }
  .vending::after { content:'🥤'; position:absolute; top:8px; left:50%; transform:translateX(-50%); font-size:13px; background:#fff3; border-radius:2px; padding:1px 3px; }

  .tv-unit { position:absolute; z-index:5; }
  .tv-screen { width:120px; height:66px; background:#131a2b; border:5px solid #2c3550; border-radius:6px; position:relative; overflow:hidden; }
  .tv-screen.on::after {
    content:''; position:absolute; inset:4px; border-radius:3px;
    background:linear-gradient(120deg,#3ddc84,#1454FF,#c2437e); background-size:300% 300%;
    animation:tvplay 1.6s infinite alternate;
  }
  @keyframes tvplay { from { background-position:0 0; filter:brightness(.9);} to { background-position:100% 100%; filter:brightness(1.2);} }
  .tv-stand { width:70px; height:8px; background:#4a5468; margin:0 auto; border-radius:0 0 4px 4px; }
  .sofa { position:absolute; width:170px; height:46px; background:#7a4fb5; border-radius:10px 10px 6px 6px; box-shadow:0 6px 0 #5d3a8e, inset 0 8px 0 #9168c9; z-index:400; }
  .sofa::before, .sofa::after { content:''; position:absolute; top:-8px; width:14px; height:40px; background:#5d3a8e; border-radius:6px; }
  .sofa::before { left:-6px; } .sofa::after { right:-6px; }

  .pp-table { position:absolute; width:190px; height:96px; background:#2f7d4f; border:5px solid #1d5c37; border-radius:8px; z-index:4; }
  .pp-table::after { content:''; position:absolute; left:50%; top:-6px; bottom:-6px; width:5px; margin-left:-2px; background:#f2f2f2; border-radius:2px; }
  #ppball { position:absolute; width:9px; height:9px; background:#fff; border-radius:50%; box-shadow:0 1px 2px rgba(0,0,0,.4); z-index:450; display:none; }
  #ppball.play { display:block; animation:rally 0.8s infinite alternate ease-in-out; }
  @keyframes rally { from { transform:translate(0,0);} 50% { transform:translate(80px,-16px);} to { transform:translate(160px,0);} }

  .plant2 { font-size:30px; }

  /* ---- 캐릭터 ---- */
  .person { position:absolute; width:32px; height:50px; }
  .p-inner { position:relative; width:32px; height:50px; }
  .person.working .p-bob { animation:type-bob .45s infinite alternate; }
  @keyframes type-bob { to { transform:translateY(-2px); } }
  .p-head { position:relative; width:20px; height:17px; margin:0 auto; border-radius:5px 5px 3px 3px; }
  .p-hair { position:absolute; top:-2px; left:-1px; right:-1px; height:8px; border-radius:5px 5px 2px 2px; }
  .p-eyes { position:absolute; bottom:4px; left:4px; width:3px; height:3px; background:#1c1c1c; border-radius:50%; box-shadow:9px 0 0 #1c1c1c; }
  .p-torso { width:26px; height:17px; margin:-1px auto 0; border-radius:4px; position:relative; }
  .p-arm { position:absolute; top:2px; width:5px; height:13px; border-radius:3px; }
  .p-arm.l { left:-4px; } .p-arm.r { right:-4px; }
  .p-legs { display:flex; justify-content:center; gap:5px; margin-top:-1px; }
  .p-leg { width:8px; height:13px; background:#2b3a55; border-radius:0 0 3px 3px; transform-origin:top center; }
  .person.walk .p-leg.l { animation:step .3s infinite alternate; }
  .person.walk .p-leg.r { animation:step .3s infinite alternate-reverse; }
  @keyframes step { from { transform:rotate(18deg); } to { transform:rotate(-18deg); } }
  .person.sitting .p-leg { height:6px; }
  .person.sitting { transform:translateY(4px); }
  .p-shadow { position:absolute; bottom:-3px; left:50%; transform:translateX(-50%); width:26px; height:7px; background:rgba(0,0,0,.18); border-radius:50%; }
  .p-name {
    position:absolute; top:52px; left:50%; transform:translateX(-50%);
    font-size:10px; font-weight:800; color:#26355c; background:rgba(255,255,255,.88);
    padding:1px 6px; border-radius:99px; white-space:nowrap;
  }
  .p-item { position:absolute; top:14px; right:-14px; font-size:15px; display:none; }
  .person.leisure .p-item { display:block; animation:munch .7s infinite alternate; }
  @keyframes munch { from { transform:translateY(0) rotate(0);} to { transform:translateY(-3px) rotate(-12deg);} }
  .p-bubble {
    position:absolute; bottom:56px; left:50%; transform:translateX(-50%);
    background:#fff; border:2px solid #26355c; border-radius:8px;
    font-size:11px; font-weight:600; padding:4px 8px; white-space:nowrap;
    max-width:230px; overflow:hidden; text-overflow:ellipsis;
    opacity:0; transition:opacity .3s; z-index:1000;
  }
  .p-bubble::after {
    content:''; position:absolute; bottom:-6px; left:50%; margin-left:-5px;
    border:5px solid transparent; border-top-color:#26355c; border-bottom:0;
  }
  .person.working .p-bubble, .person.error .p-bubble, .person.show-bubble .p-bubble { opacity:1; }
  .person.error .p-bubble { border-color:#E11D1D; color:#E11D1D; }

  /* ---- 하단 패널 공통 ---- */
  .panel { background:#fff; border-radius:14px; padding:16px 20px; }
  .panel h2 { font-size:15px; font-weight:800; margin-bottom:10px; color:#0A1B4D; }
  .bottom-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; }
  @media (max-width: 720px) { .bottom-grid { grid-template-columns:1fr; } }

  /* ---- 갤러리 ---- */
  #gallery-strip { display:flex; gap:14px; overflow-x:auto; padding-bottom:6px; }
  .g-item { flex:0 0 150px; cursor:pointer; text-align:center; }
  .g-item img { width:150px; height:150px; border-radius:12px; border:3px solid #e6eaf4; display:block; }
  .g-item:hover img { border-color:#1454FF; }
  .g-title { font-size:12px; font-weight:700; margin-top:6px; color:#26355c; line-height:1.3; word-break:keep-all; }
  .g-date { font-size:11px; color:#98a2b8; }

  /* ---- 뷰어 모달 ---- */
  #viewer { position:fixed; inset:0; background:rgba(4,10,32,.9); display:none; z-index:5000;
    align-items:center; justify-content:center; flex-direction:column; gap:14px; padding:20px; }
  #viewer.open { display:flex; }
  #viewer img { max-width:min(92vw, 560px); max-height:70vh; border-radius:14px; }
  #v-nav { display:flex; align-items:center; gap:18px; color:#fff; font-weight:700; }
  #v-nav button { background:#1454FF; color:#fff; border:none; border-radius:999px; width:44px; height:44px; font-size:20px; cursor:pointer; }
  #v-nav button:disabled { opacity:.3; }
  #v-links a { color:#9fd0ff; font-size:13px; }
  #v-close { position:absolute; top:18px; right:24px; background:none; border:none; color:#fff; font-size:30px; cursor:pointer; }

  /* ---- 작업 요청 ---- */
  #req-form { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  #req-form input { border:2px solid #dfe5f2; border-radius:10px; padding:10px 14px; font-size:14px; font-family:inherit; }
  #req-form input:focus { outline:none; border-color:#1454FF; }
  #req-topic { flex:1; min-width:180px; }
  #req-send { background:#1454FF; color:#fff; border:none; border-radius:10px; padding:10px 20px; font-size:14px; font-weight:700; cursor:pointer; }
  #req-send:disabled { opacity:.5; }
  #req-msg { font-size:12px; color:#0a9d58; font-weight:600; min-height:16px; margin-bottom:6px; }
  .req-row { font-size:13px; padding:7px 0; border-bottom:1px solid #F1F3F8; display:flex; gap:8px; align-items:center; }
  .req-badge { font-size:11px; font-weight:700; padding:2px 10px; border-radius:99px; white-space:nowrap; }
  .req-badge.pending { background:#fff3d6; color:#a06b00; }
  .req-badge.working { background:#dce7ff; color:#1454FF; }
  .req-badge.done { background:#dcf5e7; color:#0a9d58; }
  .req-badge.rejected { background:#fde3e3; color:#c22; }
  .req-row a { color:#1454FF; font-size:12px; }

  /* ---- 업무 일지 ---- */
  /* 근거 검증실 */
  #ev-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .ev-tab {
    border:2px solid #dfe5f2; background:#fff; border-radius:999px;
    padding:6px 14px; font-size:12px; font-weight:700; cursor:pointer; color:#5a6884; font-family:inherit;
  }
  .ev-tab.on { background:#1454FF; border-color:#1454FF; color:#fff; }
  .ev-row { display:flex; gap:10px; align-items:flex-start; font-size:13px; padding:8px 0; border-bottom:1px solid #F1F3F8; }
  .ev-card-badge {
    flex:none; background:#EEF3FF; color:#1454FF; font-size:11px; font-weight:800;
    padding:2px 8px; border-radius:6px; margin-top:1px;
  }
  .ev-kind { flex:none; font-size:11px; color:#98a2b8; margin-top:2px; width:52px; }
  .ev-claim { flex:1; line-height:1.45; word-break:keep-all; }
  .ev-link { flex:none; font-size:12px; font-weight:700; color:#1454FF; text-decoration:none; margin-top:1px; white-space:nowrap; }
  .ev-link:hover { text-decoration:underline; }
  #v-evidence {
    background:rgba(255,255,255,.08); border-radius:12px; padding:10px 16px;
    max-width:min(92vw, 560px); width:100%; color:#fff; font-size:12px;
  }
  #v-evidence .ev-row { border-color:rgba(255,255,255,.12); padding:6px 0; }
  #v-evidence .ev-link { color:#9fd0ff; }
  #v-evidence .ev-card-badge { background:rgba(255,255,255,.15); color:#9fd0ff; }
  #v-ev-title { font-weight:800; font-size:12px; margin-bottom:2px; color:rgba(255,255,255,.75); }

  #log-panel { max-height:260px; overflow-y:auto; }
  .journal .entry { font-size:12px; padding:5px 0; border-bottom:1px solid #F1F3F8; }
  .journal .who { font-weight:700; color:#1454FF; }
  .journal .time { color:#aaa; font-size:10px; }
  .updated { color:rgba(255,255,255,.45); font-size:11px; margin-top:10px; text-align:right; }
</style>

const H = { apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY };
const sfetch = (path, opt = {}) =>
  fetch(`${SUPA_URL}/rest/v1/${path}`, { ...opt, headers: { ...H, 'Content-Type': 'application/json', ...(opt.headers || {}) } });

// ---------- 캐릭터/무대 설정 ----------
const ROLES = {
  chief:      { name:'무결',   role:'편집장',  shirt:'#3a4a6b', hair:'#2c2c2c', skin:'#f2c9a0' },
  researcher: { name:'윤호',   role:'리서처',  shirt:'#8a6d3b', hair:'#5b3a1e', skin:'#f2c9a0' },
  writer:     { name:'연아',   role:'작가',    shirt:'#1454FF', hair:'#6b4226', skin:'#ffd9b0' },
  designer:   { name:'지디',   role:'디자이너', shirt:'#c2437e', hair:'#e0b830', skin:'#f2c9a0' },
  reviewer:   { name:'개빡빡', role:'검수자',  shirt:'#0a9d58', hair:'#3d3d3d', skin:'#e8b98a' },
  publisher:  { name:'막뿌려', role:'발행인',  shirt:'#e07b00', hair:'#111', skin:'#ffd9b0' },
};
const DESKS = {
  researcher: { x:360, y:110 }, writer: { x:560, y:110 },
  designer:   { x:360, y:250 }, reviewer: { x:560, y:250 },
  publisher:  { x:700, y:180 }, chief: { x:1000, y:120 },
};
const workPos = (d) => ({ x:d.x+41, y:d.y+24 });
const LEISURE = [
  { id:'eat1',  x:85,  y:545, act:'eat' },
  { id:'eat2',  x:195, y:545, act:'eat' },
  { id:'eat3',  x:140, y:610, act:'eat' },
  { id:'coffee',x:92,  y:475, act:'drink' },
  { id:'sofa1', x:440, y:592, act:'game' },
  { id:'sofa2', x:510, y:592, act:'game' },
  { id:'pp-L',  x:765, y:555, act:'pp', face:1 },
  { id:'pp-R',  x:1010, y:555, act:'pp', face:-1 },
];
const ITEM = { drink:'☕', game:'🎮', pp:'🏓' };
const EAT_ITEMS = ['🍜','🥤','🍫','🍪'];
const SPEED = 90;

const inBreak = (p) => p.x < 315 && p.y > 365;
const inChief = (p) => p.x > 865 && p.y < 275;
const BREAK_DOOR_OUT = {x:340,y:467}, BREAK_DOOR_IN = {x:270,y:467};
const CHIEF_DOOR_OUT = {x:845,y:135}, CHIEF_DOOR_IN = {x:915,y:135};
const PATROL = [ {x:460,y:200},{x:660,y:200},{x:660,y:340},{x:460,y:340},{x:740,y:280} ];

function route(from, to) {
  const wp = [];
  if (inBreak(from) && !inBreak(to)) wp.push(BREAK_DOOR_IN, BREAK_DOOR_OUT);
  if (inChief(from) && !inChief(to)) wp.push(CHIEF_DOOR_IN, CHIEF_DOOR_OUT);
  if (!inBreak(from) && inBreak(to)) wp.push(BREAK_DOOR_OUT, BREAK_DOOR_IN);
  if (!inChief(from) && inChief(to)) wp.push(CHIEF_DOOR_OUT, CHIEF_DOOR_IN);
  wp.push({x:to.x, y:to.y});
  return wp;
}

const stage = document.getElementById('stage');
for (const [role, d] of Object.entries(DESKS)) {
  const el = document.createElement('div');
  el.className = 'desk'; el.id = 'desk-' + role;
  el.style.left = d.x + 'px'; el.style.top = d.y + 'px';
  el.style.zIndex = d.y + 62;
  el.innerHTML = `<div class="monitor"></div><div class="kb"></div><div class="doc"></div>
    <div class="desk-label">${ROLES[role].name} · ${ROLES[role].role}</div>`;
  stage.appendChild(el);
}

const occupied = {};
const chars = {};
Object.entries(ROLES).forEach(([role, cfg], i) => {
  const el = document.createElement('div');
  el.className = 'person'; el.id = 'p-' + role;
  el.innerHTML = `
    <div class="p-bubble"></div>
    <div class="p-inner"><div class="p-bob">
      <div class="p-head" style="background:${cfg.skin}"><div class="p-hair" style="background:${cfg.hair}"></div><div class="p-eyes"></div></div>
      <div class="p-torso" style="background:${cfg.shirt}">
        <div class="p-arm l" style="background:${cfg.shirt}"></div><div class="p-arm r" style="background:${cfg.shirt}"></div>
      </div>
      <div class="p-legs"><div class="p-leg l"></div><div class="p-leg r"></div></div>
    </div></div>
    <div class="p-shadow"></div>
    <div class="p-item"></div>
    <div class="p-name">${cfg.name}</div>`;
  stage.appendChild(el);
  const spot = role === 'chief' ? workPos(DESKS.chief) : LEISURE[i % LEISURE.length];
  chars[role] = { el, x:spot.x, y:spot.y, queue:[], state:'', wanderAt:0, patrolIdx:0, spot:null };
});

function freeSpots() { return LEISURE.filter(s => !occupied[s.id]); }
function releaseSpot(role) {
  const c = chars[role];
  if (c.spot) { delete occupied[c.spot.id]; c.spot = null; }
}
function claimLeisure(role) {
  const c = chars[role];
  releaseSpot(role);
  const free = freeSpots();
  const spot = free[Math.floor(Math.random() * free.length)] || LEISURE[0];
  occupied[spot.id] = role; c.spot = spot;
  c.queue = route({x:c.x,y:c.y}, spot);
}

// ---------- 상태 폴링 ----------
async function fetchStatus() {
  let status;
  try {
    const rows = await (await sfetch('office_status?id=eq.1&select=data,updated_at')).json();
    if (!rows.length) return;
    status = rows[0].data;
    document.getElementById('updated').textContent = '마지막 갱신: ' + new Date(rows[0].updated_at).toLocaleString('ko-KR');
  } catch (e) { return; }

  document.getElementById('topic').textContent = '📌 ' + (status.topic || '대기 중');
  document.getElementById('log').innerHTML = (status.log || []).map(e => {
    const r = ROLES[e.role];
    return `<div class="entry"><span class="time">${e.time}</span> <span class="who">${r ? r.name + '(' + r.role + ')' : e.role}</span> ${e.msg}</div>`;
  }).join('') || '<div class="entry">아직 기록이 없습니다</div>';

  for (const [role, c] of Object.entries(chars)) {
    const a = (status.agents || {})[role] || { state:'idle', msg:'' };
    c.el.querySelector('.p-bubble').textContent = a.msg || '';
    document.getElementById('desk-' + role).classList.toggle('on', a.state === 'working');
    c.el.classList.toggle('error', a.state === 'error');

    if (a.state !== c.state) {
      c.state = a.state;
      if (a.state === 'working' || a.state === 'error') {
        releaseSpot(role);
        if (role === 'chief') { c.queue = route({x:c.x,y:c.y}, PATROL[0]); c.patrolIdx = 0; }
        else c.queue = route({x:c.x,y:c.y}, workPos(DESKS[role]));
      } else {
        if (role === 'chief') c.queue = route({x:c.x,y:c.y}, workPos(DESKS.chief));
        else claimLeisure(role);
        if (a.state === 'done' && a.msg) {
          c.el.classList.add('show-bubble');
          setTimeout(() => c.el.classList.remove('show-bubble'), 6000);
        }
      }
    }
  }
}

// ---------- 이동/연출 루프 ----------
let last = performance.now();
function tick() {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 1); last = now;

  for (const [role, c] of Object.entries(chars)) {
    const target = c.queue[0];
    if (target) {
      const dx = target.x - c.x, dy = target.y - c.y;
      const dist = Math.hypot(dx, dy);
      const step = SPEED * dt;
      if (dist <= step) { c.x = target.x; c.y = target.y; c.queue.shift(); }
      else {
        c.x += dx / dist * step; c.y += dy / dist * step;
        if (Math.abs(dx) > 2) c.el.querySelector('.p-inner').style.transform = dx < 0 ? 'scaleX(-1)' : '';
      }
      c.el.classList.add('walk');
      c.el.classList.remove('leisure', 'sitting');
    } else {
      c.el.classList.remove('walk');
      const resting = c.state === 'idle' || c.state === 'done';

      if (role === 'chief' && (c.state === 'working' || c.state === 'error')) {
        c.patrolIdx = (c.patrolIdx + 1) % PATROL.length;
        c.queue = [PATROL[c.patrolIdx]];
      }
      else if (role !== 'chief' && resting && c.spot) {
        c.el.classList.add('leisure');
        const item = c.el.querySelector('.p-item');
        if (c.spot.act === 'eat') { if (!item.textContent || '🎮🏓☕'.includes(item.textContent)) item.textContent = EAT_ITEMS[Math.floor(Math.random()*EAT_ITEMS.length)]; }
        else item.textContent = ITEM[c.spot.act];
        if (c.spot.act === 'game') c.el.classList.add('sitting');
        if (c.spot.face) c.el.querySelector('.p-inner').style.transform = c.spot.face < 0 ? 'scaleX(-1)' : '';
        if (now > c.wanderAt) {
          c.wanderAt = now + 9000 + Math.random() * 14000;
          if (Math.random() < 0.45) claimLeisure(role);
        }
      }
    }
    c.el.classList.toggle('working', (c.state === 'working') && !c.queue.length && role !== 'chief');
    c.el.style.left = (c.x - 16) + 'px';
    c.el.style.top = (c.y - 50) + 'px';
    c.el.style.zIndex = Math.round(c.y);
  }

  const ppOn = occupied['pp-L'] && occupied['pp-R']
    && !chars[occupied['pp-L']].queue.length && !chars[occupied['pp-R']].queue.length;
  document.getElementById('ppball').classList.toggle('play', !!ppOn);
  const tvOn = occupied['sofa1'] || occupied['sofa2'];
  document.getElementById('tv').classList.toggle('on', !!tvOn);
}

// ---------- 갤러리 + 뷰어 ----------
let posts = [];
let vPost = null, vIdx = 0;
const cardUrl = (p, i) => `${p.base_url}/card-${String(i + 1).padStart(2, '0')}.png`;

async function fetchPosts() {
  try { posts = await (await sfetch('office_posts?select=*&order=date.desc,slug.desc')).json(); }
  catch (e) { return; }
  document.getElementById('gallery-strip').innerHTML = posts.map((p, i) =>
    `<div class="g-item" onclick="openViewer(${i})">
      <img src="${cardUrl(p, 0)}" loading="lazy" alt="${p.topic}">
      <div class="g-title">${p.topic}</div>
      <div class="g-date">${p.date} · ${p.cards}장</div>
    </div>`
  ).join('') || '아직 발행물이 없습니다';
  renderEvTabs();
}
function renderViewer() {
  document.getElementById('v-img').src = cardUrl(vPost, vIdx);
  document.getElementById('v-count').textContent = `${vIdx + 1} / ${vPost.cards}`;
  document.getElementById('v-prev').disabled = vIdx === 0;
  document.getElementById('v-next').disabled = vIdx === vPost.cards - 1;
  const a = document.getElementById('v-insta');
  a.style.display = vPost.permalink ? '' : 'none';
  a.href = vPost.permalink || '#';
  // 이 카드의 근거 표시
  const items = (evidence[vPost.slug] || []).filter(e => e.card === vIdx + 1);
  const box = document.getElementById('v-evidence');
  box.hidden = !items.length;
  box.innerHTML = items.length ? '<div id="v-ev-title">📎 이 카드의 근거</div>' + items.map(evRow).join('') : '';
}

// ---------- 근거 검증실 ----------
let evidence = {}; // slug → items
let evSelected = null;
const esc = (t) => String(t || '').replace(/</g, '&lt;');
const evRow = (e) => `<div class="ev-row">
  <span class="ev-card-badge">카드 ${esc(e.card)}</span>
  <span class="ev-kind">${esc(e.kind)}</span>
  <span class="ev-claim">${esc(e.claim)}</span>
  <a class="ev-link" href="${encodeURI(e.url || '')}" target="_blank" rel="noopener">${esc(e.source)} ↗</a>
</div>`;

async function fetchEvidence() {
  try {
    const rows = await (await sfetch('office_evidence?select=slug,items')).json();
    evidence = Object.fromEntries(rows.map(r => [r.slug, r.items]));
  } catch (e) { return; }
  renderEvTabs();
}
function renderEvTabs() {
  const slugs = posts.filter(p => evidence[p.slug]).map(p => p.slug);
  if (!slugs.length) { document.getElementById('ev-list').textContent = '아직 검증 자료가 없습니다'; return; }
  if (!evSelected || !evidence[evSelected]) evSelected = slugs[0];
  document.getElementById('ev-tabs').innerHTML = posts.filter(p => evidence[p.slug]).map(p =>
    `<button class="ev-tab ${p.slug === evSelected ? 'on' : ''}" onclick="selectEv('${p.slug}')">${esc(p.topic)}</button>`
  ).join('');
  document.getElementById('ev-list').innerHTML =
    (evidence[evSelected] || []).slice().sort((a, b) => a.card - b.card).map(evRow).join('');
}
window.selectEv = (slug) => { evSelected = slug; renderEvTabs(); };
window.openViewer = (i) => { vPost = posts[i]; vIdx = 0; renderViewer(); document.getElementById('viewer').classList.add('open'); };
document.getElementById('v-close').onclick = () => document.getElementById('viewer').classList.remove('open');
document.getElementById('viewer').onclick = (e) => { if (e.target.id === 'viewer') document.getElementById('viewer').classList.remove('open'); };
document.getElementById('v-prev').onclick = () => { if (vIdx > 0) { vIdx--; renderViewer(); } };
document.getElementById('v-next').onclick = () => { if (vIdx < vPost.cards - 1) { vIdx++; renderViewer(); } };
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('viewer').classList.contains('open')) return;
  if (e.key === 'ArrowLeft' && vIdx > 0) { vIdx--; renderViewer(); }
  if (e.key === 'ArrowRight' && vIdx < vPost.cards - 1) { vIdx++; renderViewer(); }
  if (e.key === 'Escape') document.getElementById('viewer').classList.remove('open');
});

// ---------- 작업 요청 ----------
const BADGE = { pending:'검토 대기', working:'제작 중', done:'완료', rejected:'보류' };
async function fetchRequests() {
  let reqs;
  try { reqs = await (await sfetch('office_requests?select=*&order=id.desc&limit=8')).json(); }
  catch (e) { return; }
  document.getElementById('req-list').innerHTML = reqs.map(r =>
    `<div class="req-row">
      <span class="req-badge ${r.status}">${BADGE[r.status] || r.status}</span>
      <span style="flex:1">${r.topic.replace(/</g, '&lt;')}${r.requester ? ` <span style="color:#98a2b8;font-size:11px">— ${String(r.requester).replace(/</g, '&lt;')}님</span>` : ''}</span>
      ${r.result_url ? `<a href="${r.result_url}" target="_blank" rel="noopener">보기↗</a>` : ''}
    </div>`
  ).join('') || '<div class="req-row">아직 요청이 없습니다</div>';
}
document.getElementById('req-send').onclick = async () => {
  const input = document.getElementById('req-topic');
  const topic = input.value.trim();
  if (topic.length < 2) return;
  const btn = document.getElementById('req-send');
  btn.disabled = true;
  const requester = document.getElementById('req-name').value.trim() || null;
  try {
    const res = await sfetch('office_requests', { method:'POST', body: JSON.stringify({ topic, requester }) });
    if (!res.ok) throw new Error(await res.text());
    input.value = '';
    document.getElementById('req-msg').textContent = '접수됐습니다! 편집국 검토 후 제작됩니다 ✅';
    setTimeout(() => document.getElementById('req-msg').textContent = '', 5000);
    fetchRequests();
  } catch (e) {
    document.getElementById('req-msg').textContent = '요청 실패 — 잠시 후 다시 시도해주세요';
  }
  btn.disabled = false;
};
document.getElementById('req-topic').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('req-send').click(); });

// ---------- 스케일/시작 ----------
function fit() {
  const w = document.getElementById('stage-wrap').clientWidth;
  const s = Math.min(1, w / 1220);
  stage.style.transform = `scale(${s})`;
  document.getElementById('stage-wrap').style.height = (700 * s) + 'px';
}
window.addEventListener('resize', fit);

fit();
fetchStatus(); fetchPosts(); fetchRequests(); fetchEvidence();
setInterval(fetchEvidence, 60000);
setInterval(fetchStatus, 2500);
setInterval(fetchRequests, 10000);
setInterval(fetchPosts, 30000);
setInterval(tick, 33);
</script>
